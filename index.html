<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelPulse</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 class="hed">PixelPulse</h1>

        <form id="search-form">
            <input
                id="search-input"
                type="search"
                placeholder="Search images..."
                autocomplete="off"
            >
            <button type="submit">Search</button>
            <button type="button" id="clear-button">Clear</button>
        </form>

        <div class="suggestions">
            <span class="suggestion-label">Popular:</span>
            <button type="button" class="suggestion">Nature</button>
            <button type="button" class="suggestion">Cars</button>
            <button type="button" class="suggestion">Anime</button>
            <button type="button" class="suggestion">Gaming</button>
            <button type="button" class="suggestion">Space</button>
            <button type="button" class="suggestion">Aesthetic</button>
        </div>
    </header>

    <main>
        <p id="status"></p>
        <section id="results"></section>
    </main>

    <script>
        const searchInput = document.getElementById("search-input");
        const clearButton = document.getElementById("clear-button");
        const searchForm = document.getElementById("search-form");

        clearButton.addEventListener("click", () => {
            searchInput.value = "";
            searchInput.focus();
        });

        document.querySelectorAll(".suggestion").forEach((suggestion) => {
            suggestion.addEventListener("click", () => {
                searchInput.value = suggestion.textContent;
                searchInput.focus();
            });
        });

        searchForm.addEventListener("submit", (event) => {
            event.preventDefault();
            document.getElementById("status").textContent =
                searchInput.value.trim()
                    ? `Ready to search for "${searchInput.value.trim()}". Connect your image API in script.js to load results.`
                    : "Please enter a search term.";
        });
    </script>
</body>
</html>
